# ===========================================================================
#  Ness D8x/D16x monitor configuration
#  Copy to /etc/ness-monitor/ness-monitor.conf and edit.
#  chmod 600 this file - it holds tokens/passwords.
# ===========================================================================

[ness]
# IP232 module address and port
host = <Replace with IPADDRESS>
port = <Replace with port e.g. 2401>
# Reconnect backoff (grows from min to max on repeated failures)
reconnect_min_seconds = 2
reconnect_max_seconds = 60
# Suppress duplicate identical frames arriving within this window
dedup_seconds = 2.0

[logging]
# DEBUG | INFO | WARNING | ERROR
level = INFO

[storage]
enabled = true
db_path = /var/local/lib/ness-monitor/ness-monitor.db

[notify]
# Which priority levels trigger a push. Everything is still logged to SQLite.
#   high   = alarm, tamper, power/battery/report/supervision failure
#   normal = arm/disarm, alarm restore, entry-delay start
#   low    = motion, seal/unseal, outputs, exit delay, etc.
# Default pushes high + normal, and stays quiet on routine motion.
push_levels = high,normal

# --------------------------------------------------------------------------- #
#  ntfy  (default - free, open source, self-hostable)
#  1. Install the ntfy app (iOS / Android) or use the web app.
#  2. Subscribe to a hard-to-guess topic name, e.g. ness-alarm-8fk3d9.
#  3. Put that same topic below. Anyone who knows the topic can read it,
#     so make it random, or self-host ntfy and set a token.
# --------------------------------------------------------------------------- #
[ntfy]
enabled = true
server = https://ntfy.sh
topic = CHANGE-ME-to-a-random-topic-name
# token =            # only for self-hosted / reserved topics (Bearer token)

# --------------------------------------------------------------------------- #
#  Pushover  (paid one-off app, very reliable)
# --------------------------------------------------------------------------- #
[pushover]
enabled = false
token = YOUR_APP_TOKEN
user = YOUR_USER_KEY

# --------------------------------------------------------------------------- #
#  Telegram bot  (free)
#  Create a bot via @BotFather, get the bot token; get your chat_id from
#  @userinfobot or the getUpdates API.
# --------------------------------------------------------------------------- #
[telegram]
enabled = false
bot_token = 123456:ABC-DEF...
chat_id = 123456789

# --------------------------------------------------------------------------- #
#  Email  (native SMTP - no external sendemail binary needed)
# --------------------------------------------------------------------------- #
[email]
enabled = false
smtp_host = smtp.gmail.com
smtp_port = 587
use_tls = true
username = you@gmail.com
password = your-app-password
from = alarm@yourdomain.com
# Comma or semicolon separated
recipients = you@example.com, partner@example.com

# --------------------------------------------------------------------------- #
#  Friendly zone names (zone number = name). Extend to match your install.
#  These override the built-in defaults.
# --------------------------------------------------------------------------- #
[zones]
1 = Garage
2 = Lounge
3 = Dining
4 = Family
5 = Upstairs
